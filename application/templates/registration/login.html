{% extends "base.html" %}
{% block content %}
<section class="form-panel panel auth-panel">
<h1>Вход в кабинет</h1>
<form method="post">{% csrf_token %}
{% if form.errors %}<p class="form-message">Неверный логин или пароль.</p>{% endif %}
 {{ form.as_p }}
 <input type="hidden" name="next" value="{{ next }}">
 <button class="button submit" type="submit">Войти</button>
 <p><a href="{% url 'register' %}">Создать аккаунт</a></p>
</form>
</section>
{% endblock %}
